# Network-Rules / QuantumultX Sample
# 先替换 [server_local] 或 [server_remote] 里的占位节点，再按需精简策略组。

[general]
server_check_url=http://www.gstatic.com/generate_204
geo_location_checker=http://ip-api.com/json/?lang=zh-CN
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me
udp_whitelist=53, 123
fallback_udp_policy=reject
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 17.0.0.0/8

[dns]
server=223.5.5.5
server=114.114.114.114
server=119.29.29.29
server=8.8.8.8

[policy]
available=PROXY, HK, US, SG, JP
available=AI, HK, US, SG, JP
available=Telegram, HK, US, SG, JP
available=X, HK, US, SG, JP
available=Discord, HK, US, SG, JP
available=Slack, HK, US, SG, JP
available=Facebook, HK, US, SG, JP
available=YouTube, HK, US, SG, JP
available=TikTok, HK, US, SG, JP
available=Spotify, HK, US, SG, JP
available=ForeignMedia, HK, US, SG, JP
available=PornHub, HK, US, SG, JP
static=iCloud, direct, HK, US, SG, JP
static=Apple, direct, HK, US, SG, JP
available=Google, HK, US, SG, JP
available=Microsoft, HK, US, SG, JP
available=GitHub, HK, US, SG, JP
available=CloudFlare, HK, US, SG, JP
available=PayPal, HK, US, SG, JP
available=Crypto, HK, US, SG, JP
static=SpeedTest, direct, HK, US, SG, JP

[server_remote]
;https://example.com/subscribe.txt, tag=Remote, enabled=true

[server_local]
shadowsocks=hk.example.com:443, method=aes-128-gcm, password=password, obfs=tls, obfs-host=hk.example.com, fast-open=false, udp-relay=true, tag=HK
shadowsocks=us.example.com:443, method=aes-128-gcm, password=password, obfs=tls, obfs-host=us.example.com, fast-open=false, udp-relay=true, tag=US
shadowsocks=sg.example.com:443, method=aes-128-gcm, password=password, obfs=tls, obfs-host=sg.example.com, fast-open=false, udp-relay=true, tag=SG
shadowsocks=jp.example.com:443, method=aes-128-gcm, password=password, obfs=tls, obfs-host=jp.example.com, fast-open=false, udp-relay=true, tag=JP

[filter_remote]
